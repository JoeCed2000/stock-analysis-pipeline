name: Secret Scan

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Full history for diff scanning

      - name: Scan for secrets in changed files
        run: |
          set -euo pipefail

          # Get list of changed files (vs parent commit, or all files if new branch)
          if git rev-parse HEAD~1 >/dev/null 2>&1; then
            FILES=$(git diff --name-only --diff-filter=ACM HEAD~1..HEAD)
          else
            FILES=$(git ls-files)
          fi

          VIOLATIONS=0

          for file in $FILES; do
            [[ -z "$file" ]] && continue
            [[ ! -f "$file" ]] && continue

            # Skip binary
            MIME=$(file -b --mime-type "$file" 2>/dev/null || echo "")
            [[ "$MIME" != text/* ]] && continue

            # Patterns to detect
            if grep -qnE \
              -e '[A-Z_]+_API_KEY=' \
              -e '[A-Z_]+_TOKEN=' \
              -e '[A-Z_]+_SECRET=' \
              -e 'api[_-]?key[[:space:]]*[:=][[:space:]]*["'"'"']?[A-Za-z0-9+/=_-]{20,}' \
              -e 'EODHD[A-Za-z0-9]{10,}' \
              -e 'RAPIDAPI[A-Za-z0-9_-]{10,}' \
              -e 'seekingalpha.*cookie' \
              -e 'cookie[[:space:]]*[:=][[:space:]]*["'"'"']?[a-z0-9]{15,}' \
              -e 'session[[:space:]]*[:=][[:space:]]*["'"'"']?[A-Za-z0-9+/=]{20,}' \
              -e '-----BEGIN (RSA|EC|DSA|OPENSSH|PGP) PRIVATE KEY-----' \
              -e 'Authorization:[[:space:]]*(Bearer|Basic)[[:space:]]+[A-Za-z0-9+/=_-]{15,}' \
              -e 'ghp_[A-Za-z0-9]{20,}' \
              -e 'sk-[A-Za-z0-9]{20,}' \
              "$file" 2>/dev/null; then
              echo "::error file=$file::Secret pattern detected"
              VIOLATIONS=$((VIOLATIONS + 1))
            fi
          done

          if [[ $VIOLATIONS -gt 0 ]]; then
            echo "::error::$VIOLATIONS file(s) contain secrets — commit blocked"
            exit 1
          fi

          echo "✓ No secrets detected in $([ $(echo "$FILES" | wc -w) -gt 0 ] && echo "$FILES" | wc -w || echo 0) files"
